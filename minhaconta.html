<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha conta | E-Loop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="minhaconta.js" defer></script>
    <script src="carrinho-sync.js" defer></script>
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
      <img src="src/logo.png" alt="Logo E-Loop" class="logo-principal">
      <div class="search">
        <input type="text" placeholder="Buscar...">
        <button><i class="fa fa-search"></i></button>
      </div>
      <nav>
        <a href="index.html">Início</a>
        <a href="explorar.html">Explorar</a>
        <a href="carrinho.html" class="carrinho-link">
          <i class="fa fa-shopping-cart"></i> 
          Carrinho <span id="contadorCarrinho">0</span>
        </a>
        <a href="anunciar.html">Anunciar</a>
        <a href="minhaconta.html" class="ativo">Minha Conta</a>
        <a href="sobre.html">Sobre</a>
      </nav>
    </header>

    <!-- Perfil -->
    <main class="perfil-container">
      <section class="perfil-header">
        <img id="foto-perfil" src="https://i.pravatar.cc/150?img=12" alt="Foto de Perfil" class="foto-perfil">
        <div>
          <h2 id="user-name">Carregando...</h2>
          <p id="user-tipo">Carregando...</p>
          <p id="user-bio">Carregando...</p>

          <div class="botoes-perfil">
            <button id="btn-editar-perfil" class="editar"><i class="fa fa-user-edit"></i> Editar</button>
            <button class="sair" onclick="sair()"><i class="fa fa-sign-out-alt"></i> Sair</button>
          </div>
        </div>
      </section>

    <!-- FAVORITOS -->
    <section class="favoritos">
      <h3>❤️ Meus Favoritos</h3>
      <div class="cards-grid" id="containerFavoritos">
        <p id="mensagemFavoritosVazio">Você ainda não favoritou nenhum produto.</p>
      </div>
    </section>

      <!-- Histórico -->
      <section class="historico">
        <h3>🛒 Meus Anúncios</h3>
        <div class="cards-grid" id="container-dos-anuncios">
          <!-- Anúncios serão carregados dinamicamente pelo JS -->
        </div>
      </section>
    </main>

  <!-- Modal editar perfil -->
  <div id="modalEditarPerfil" class="modal-overlay" style="display:none">
    <div class="modal-card">
      <button id="fecharModal" class="modal-close">&times;</button>
      <h3>Editar Perfil</h3>

      <div class="modal-body">
        <div class="modal-left">
          <img id="modalPreviewFoto" src="https://via.placeholder.com/150" alt="Foto" class="modal-foto">
          <label class="btn-upload-modal">
            <input id="modalFotoInput" type="file" accept="image/*" style="display:none">
            <i class="fa fa-camera"></i> Trocar foto
          </label>
        </div>

        <form id="modalFormPerfil" class="modal-form">
          <label>Nome</label>
          <input id="modalNome" type="text" required>

          <label>E-mail</label>
          <input id="modalEmail" type="email" required>

          <label>Telefone</label>
          <input id="modalTelefone" type="text">

          <label>Cidade</label>
          <input id="modalCidade" type="text">

          <label>Bio</label>
          <textarea id="modalBio" rows="3"></textarea>

          <div class="modal-actions">
            <button type="button" id="modalCancelar" class="btn-limpar">Cancelar</button>
            <button type="submit" class="btn-enviar">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

    <!-- Modal editar anúncio -->
  <div id="modalEditarAnuncio" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <button id="fecharModalAnuncio" class="modal-close">&times;</button>
      <h3>Editar Anúncio</h3>

    <div class="modal-body">
      <div class="modal-left">
        <img id="previewImagemAnuncio" src="https://via.placeholder.com/150" alt="Imagem do anúncio" class="modal-foto">
        <label class="btn-upload-modal">
          <input id="inputImagemAnuncio" type="file" accept="image/*" style="display:none;">
          <i class="fa fa-camera"></i> Trocar imagem
        </label>
      </div>

      <form id="formEditarAnuncio" class="modal-form">
        <label>Título</label>
        <input id="inputTituloAnuncio" type="text" required>

        <label>Preço (R$)</label>
        <input id="inputPrecoAnuncio" type="number" step="0.01" required>

        <label>Condição</label>
        <select id="inputCondicaoAnuncio">
          <option value="Novo">Novo</option>
          <option value="Usado">Usado</option>
        </select>

        <label>Descrição</label>
        <textarea id="inputDescricaoAnuncio" rows="3"></textarea>

          <div class="modal-actions">
            <button type="button" id="cancelarEdicaoAnuncio" class="btn-limpar">Cancelar</button>
            <button type="submit" class="btn-enviar">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Avaliar Vendedor -->
  <div id="modalAvaliacao" class="modal-overlay" style="display:none">
    <div class="modal-card">
      <button id="fecharAvaliacao" class="modal-close">&times;</button>
      <h3>Avaliar Vendedor</h3>
      <p>Vendedor: <strong id="avaliacaoNomeVendedor"></strong></p>
      <div class="modal-body">
        <div class="avaliacao-estrelas" id="estrelasEscolha">
          <i class="fa fa-star" data-star="1"></i>
          <i class="fa fa-star" data-star="2"></i>
          <i class="fa fa-star" data-star="3"></i>
          <i class="fa fa-star" data-star="4"></i>
          <i class="fa fa-star" data-star="5"></i>
        </div>

        <textarea id="textoAvaliacao" rows="3" placeholder="Escreva seu comentário..."></textarea>

        <div class="modal-actions">
          <button type="button" id="btnCancelarAvaliar" class="btn-limpar">Cancelar</button>
          <button type="button" id="btnEnviarAvaliacao" class="btn-enviar">Enviar Avaliação</button>
        </div>

        <p>Média: <span id="mediaEstrelasModal">–</span> ⭐ (<span id="totalAvaliacoesModal">0 avaliações</span>)</p>
      </div>
    </div>
  </div>

</body>
</html>
