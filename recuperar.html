<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha | E-Loop</title>
  <link rel="stylesheet" href="login.css"> <!-- Você pode reaproveitar o estilo do login -->
  <script src="redefinir.js" defer></script>
</head>
<body>

  <div class="login-container">
    <h2>🔒 Recuperar senha</h2>
    <p>Digite seu e-mail para receber o link de redefinição:</p>

    <form id="formRecuperar">
      <label for="email">E-mail cadastrado</label>
      <input type="email" id="email" placeholder="seuemail@exemplo.com" required>

      <button type="submit" id="btnRecuperar">Enviar link de redefinição</button>
    </form>

    <p class="login-link">
      <a href="login.html">Voltar para o login</a>
    </p>
  </div>

</body>
</html>
