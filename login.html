<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | E-Loop</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-container">
    <h2>Bem-vindo</h2>
    <p>Faça login para continuar no E-Loop</p>

    <form id="formLogin">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="exemplo@email.com" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="********" minlength="8" required>

      <button type="submit" id="btnLogin">Entrar</button>

      <p class="opcoes">
        Não tem uma conta? <a href="cadastro.html">Cadastre-se</a><br>
        <a href="esqueci-senha.html">Esqueci minha senha</a>
      </p>
    </form>
  </div>

  <!-- 🔹 Script deve ficar no final -->
  <script type="module" src="login.js"></script>

</body>
</html>
