<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar E-mail | E-Loop</title>
  <link rel="stylesheet" href="confirmar.css">
  <script src="confirmar.js" defer></script>
</head>
<body>

  <div class="confirmar-container">
    <h2>Confirmação de Conta 🌱</h2>
    <p>Enviamos um código de verificação para o seu e-mail.<br>Digite-o abaixo para confirmar sua conta.</p>

    <form id="formConfirmar">
      <label>Código de verificação</label>
      <input type="text" id="codigo" maxlength="6" placeholder="Ex: 123456" required>

      <button type="submit" class="btn-confirmar">Confirmar</button>
      <p class="reenviar">Não recebeu? <a href="#" id="reenviarCodigo">Reenviar código</a></p>
    </form>
  </div>

</body>
</html>
