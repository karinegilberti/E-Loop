<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar | E-Loop</title>
  <link rel="stylesheet" href="cadastro.css">
  <script type="module" src="cadastro.js"></script>
</head>
<body>

  <div class="cadastro-container">
    <h2>Crie sua conta na E-Loop 🌿</h2>

    <form id="formCadastro">
      <label>Nome completo</label>
      <input type="text" id="nome" required>

      <label>E-mail</label>
      <input type="email" id="email" required>

      <label>Data de nascimento</label>
      <input type="date" id="dataNascimento" required>

      <label>CPF</label>
      <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" required>

      <label>Telefone</label>
      <input type="text" id="telefone" maxlength="15" placeholder="(00) 00000-0000" required>

      <label>CEP</label>
      <input type="text" id="cep" maxlength="9" placeholder="00000-000" required>

      <label>Estado</label>
      <input type="text" id="estado" readonly required>

      <label>Cidade</label>
      <input type="text" id="cidade" readonly required>

      <label>Senha</label>
      <input type="password" id="senha" minlength="8" required>

      <label>Confirmar senha</label>
      <input type="password" id="confirmarSenha" minlength="8" required>

      <button type="submit" class="btn-cadastrar">Cadastrar</button>
    </form>

    <p class="login-link">Já tem uma conta? <a href="login.html">Entrar</a></p>
  </div>

</body>
</html>
