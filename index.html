<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Loop</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Scripts principais -->
  <script src="produtoCard.js" defer></script>
  <script src="index.js" defer></script>
  <script src="carrinho-sync.js" defer></script>
  <script src="js/busca-global.js"></script>
  <script src="js/carrinho-api.js"></script>
</head>

<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo-search-group">
      <img src="src/logo.png" alt="Logo E-Loop" class="logo-principal">

      <div class="search">
        <input type="text" id="campoBusca" placeholder="Buscar...">
        <button id="btnBuscar"><i class="fa fa-search"></i></button>
      </div>
    </div>

    <nav>
      <a href="index.html" class="ativo">Início</a>
      <a href="explorar.html">Explorar</a>
      <a href="carrinho.html" class="carrinho-link">
        <i class="fa fa-shopping-cart"></i> 
        Carrinho <span id="contadorCarrinho">0</span>
      </a>
      <a href="anunciar.html">Anunciar</a>
      <a href="minhaconta.html">Minha Conta</a>
      <a href="sobre.html">Sobre</a>
    </nav>
  </header>

  <!-- Conteúdo principal -->
  <main class="container">
    <h1 id="boasVindas">Bem-vindo ao E-Loop</h1>

    <!-- Categorias -->
    <section class="categorias">
      <a href="roupas.html" class="cat">
        <img src="src/ROUPAS.webp" alt="Roupas">
        <span>Roupas</span>
      </a>
      <a href="livros.html" class="cat">
        <img src="src/livros.jpg" alt="Livros">
        <span>Livros</span>
      </a>
      <a href="vinis.html" class="cat">
        <img src="src/VINIS.avif" alt="Vinis">
        <span>Vinil</span>
      </a>
      <a href="cds.html" class="cat">
        <img src="src/CDS.jpg" alt="CDs">
        <span>CDs</span>
      </a>
    </section>

    <!-- Produtos carregados automaticamente -->
    <section class="produtos">
      <div class="grid-index" id="listaProdutos"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container-footer">
      <p>&copy; 2025 E-Loop | Sustentabilidade em movimento ♻️</p>
      <div class="social">
        <i class="fab fa-instagram"></i>
        <i class="fab fa-facebook"></i>
        <i class="fab fa-whatsapp"></i>
      </div>
    </div>
  </footer>

</body>
</html>
